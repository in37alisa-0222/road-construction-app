<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(2-5H-2)-道路施工 多專案相片防漏管理系統</title>
    <!-- 手機主畫面專屬「道」字圖示 -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%23facc15'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='280' fill='%23020617'>道</text></svg>">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #121826;
            color: #f3f4f6;
            touch-action: manipulation;
        }
        .high-contrast {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        .high-contrast .card-bg {
            background-color: #1a1a1a !important;
            border: 2px solid #facc15 !important;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-12 select-none">

    <!-- 頂部工程標頭 -->
    <header class="sticky top-0 z-50 bg-amber-400 text-slate-950 px-4 py-3 shadow-lg border-b-4 border-amber-500">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <span class="bg-slate-900 text-amber-400 font-black text-xs px-2 py-0.5 rounded tracking-wider uppercase">道路施工現場管理</span>
                <h1 class="text-xl md:text-2xl font-black tracking-tight leading-tight">(2-5H-2)-道路施工</h1>
            </div>
            <button id="toggleThemeBtn" onclick="toggleHighContrast()" class="bg-slate-950 hover:bg-slate-800 text-amber-400 font-bold py-2 px-3 rounded-lg text-sm flex items-center gap-1 shadow active:scale-95 transition">
                <i class="fa-solid fa-sun text-lg"></i>
                <span class="hidden sm:inline">高對比抗光</span>
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-3 sm:px-4 pt-4 space-y-6">

        <!-- 專案狀態切換分頁 -->
        <div class="card-bg bg-slate-900 rounded-2xl p-3 border-2 border-slate-700 shadow-xl space-y-3">
            <div class="flex gap-2 border-b border-slate-800 pb-2">
                <button id="tabActiveBtn" onclick="switchTab('active')" class="flex-1 py-3 text-center font-black text-lg rounded-xl transition flex items-center justify-center gap-2 bg-amber-400 text-slate-950 shadow-md">
                    <i class="fa-solid fa-person-digging"></i>
                    進行中工作面 (<span id="activeCount">0</span>)
                </button>
                <button id="tabCompletedBtn" onclick="switchTab('completed')" class="flex-1 py-3 text-center font-black text-lg rounded-xl transition flex items-center justify-center gap-2 bg-slate-800 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-circle-check text-emerald-400"></i>
                    已完成歷史歸檔 (<span id="completedCount">0</span>)
                </button>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-3">
                <div class="flex-1 w-full">
                    <label class="block text-xs font-bold text-amber-400 mb-1">
                        <i class="fa-solid fa-list-check"></i> 選擇水系編號專案：
                    </label>
                    <select id="projectSelect" onchange="selectProject(this.value)" class="w-full bg-slate-950 border-2 border-amber-400 text-white rounded-xl p-3 text-base sm:text-lg font-bold outline-none cursor-pointer">
                    </select>
                </div>
                <button onclick="createNewProjectPrompt()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black px-4 py-3 rounded-xl shadow flex items-center justify-center gap-2 text-base border border-emerald-400 whitespace-nowrap self-end transition">
                    <i class="fa-solid fa-plus text-lg"></i>
                    新增水系編號
                </button>
            </div>

            <div id="statusBar" class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs text-slate-300">
                <span id="currentStatusBadge" class="font-bold px-2.5 py-1 rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/40">
                    狀態：進行中
                </span>
                <button id="toggleArchiveBtn" onclick="manualToggleArchive()" class="text-amber-400 hover:underline font-bold flex items-center gap-1">
                    <i class="fa-solid fa-box-archive"></i> <span id="archiveBtnText">手動歸檔至「已完成」</span>
                </button>
            </div>
        </div>

        <!-- 防漏進度條卡片 -->
        <div class="card-bg bg-slate-800 rounded-2xl p-4 sm:p-5 border-2 border-amber-400/40 shadow-xl">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider">必拍照項防漏檢查</h2>
                    <p class="text-2xl sm:text-3xl font-black text-white" id="progressPercent">完成度 0%</p>
                </div>
                <div class="text-right">
                    <span id="progressCount" class="text-lg font-bold bg-slate-900 px-3 py-1 rounded-full text-amber-300 border border-amber-400/30">
                        0 / 12 項
                    </span>
                </div>
            </div>
            <div class="w-full bg-slate-950 rounded-full h-6 p-1 border border-slate-700 overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-amber-500 to-emerald-400 h-full rounded-full transition-all duration-500 w-0 flex items-center justify-end pr-2 text-xs font-black text-slate-950"></div>
            </div>
            <div class="mt-3 flex justify-between items-center text-xs text-slate-400">
                <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 bg-red-500 rounded-full animate-pulse"></span> 必填 1~12 項（缺一不可）</span>
                <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 bg-emerald-500 rounded-full"></span> 綠燈已拍攝完成</span>
            </div>
        </div>

        <!-- 1. 基本資訊欄位卡片 -->
        <div class="card-bg bg-slate-800 rounded-2xl p-4 sm:p-5 border border-slate-700 shadow-xl space-y-4">
            <div class="flex items-center gap-2 border-b border-slate-700 pb-2">
                <i class="fa-solid fa-clipboard-list text-amber-400 text-xl"></i>
                <h2 class="text-lg font-bold text-white">1. 工程基本資訊</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1">水系編號 <span class="text-red-400">*</span></label>
                    <input type="text" id="waterSystemId" placeholder="請輸入水系編號" onchange="updateCurrentProjectInfo()" class="w-full bg-slate-900 border-2 border-slate-700 focus:border-amber-400 text-white rounded-xl p-3 text-lg font-medium outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1">工班名稱 <span class="text-red-400">*</span></label>
                    <input type="text" id="teamName" placeholder="請輸入工班名稱" onchange="updateCurrentProjectInfo()" class="w-full bg-slate-900 border-2 border-slate-700 focus:border-amber-400 text-white rounded-xl p-3 text-lg font-medium outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1">開挖起始日 <span class="text-red-400">*</span></label>
                    <input type="date" id="startDate" onchange="updateCurrentProjectInfo()" class="w-full bg-slate-900 border-2 border-slate-700 focus:border-amber-400 text-white rounded-xl p-3 text-lg font-medium outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1">
                        開挖結束日 <span class="text-xs text-amber-400">(自動連結第12項照片)</span>
                    </label>
                    <input type="date" id="endDate" readonly class="w-full bg-slate-950 border-2 border-amber-500/50 text-amber-300 rounded-xl p-3 text-lg font-bold outline-none cursor-not-allowed">
                </div>
            </div>

            <div class="bg-slate-950 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                <div>
                    <span class="text-xs text-slate-400 block">自動計算結果 (扣除週日)</span>
                    <span class="text-base font-bold text-slate-200">實際施工天數</span>
                </div>
                <div class="text-right">
                    <span id="workDaysDisplay" class="text-3xl font-black text-amber-400">0</span>
                    <span class="text-sm text-slate-300 font-bold ml-1">天</span>
                </div>
            </div>
        </div>

        <!-- 4. 快捷操作：LINE 訊息複製、一鍵下載照片與刪除專案 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button onclick="copyLineMessage()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black py-4 px-4 rounded-2xl shadow-lg flex items-center justify-center gap-3 text-lg border-2 border-emerald-400/50 transition">
                <i class="fa-brands fa-line text-2xl"></i>
                複製 LINE 缺漏提醒訊息
            </button>
            <button onclick="downloadAllProjectPhotos()" class="bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-black py-4 px-4 rounded-2xl shadow-lg flex items-center justify-center gap-3 text-lg border-2 border-sky-400/50 transition">
                <i class="fa-solid fa-cloud-arrow-down text-2xl"></i>
                一鍵打包下載所有照片
            </button>
        </div>

        <div class="flex justify-between items-center px-1">
            <button onclick="exportDataJSON()" class="text-xs text-amber-400 hover:underline font-bold">
                <i class="fa-solid fa-file-arrow-down"></i> 下載全部專案備份 (JSON)
            </button>
            <button onclick="deleteCurrentProject()" class="text-xs text-red-400 hover:underline font-bold">
                <i class="fa-solid fa-trash-can"></i> 刪除此水系編號專案
            </button>
        </div>

        <!-- 2. 標準拍照項目清單 (13項) -->
        <div class="card-bg bg-slate-800 rounded-2xl p-4 sm:p-5 border border-slate-700 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-camera text-amber-400 text-xl"></i>
                    <h2 class="text-lg font-bold text-white">2. 標準相片清單與上傳</h2>
                </div>
                <span class="text-xs bg-slate-900 text-amber-300 px-2 py-1 rounded">浮水印：僅顯示簡潔日期</span>
            </div>

            <div id="photoItemsContainer" class="space-y-4"></div>
        </div>

    </main>

    <!-- 自訂 Toast 通知 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-full shadow-2xl z-50 hidden transition-all flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-xl"></i>
        <span id="toastMsg">已成功！</span>
    </div>

    <script>
        const PHOTO_ITEMS = [
            { id: 1, name: "(1) 施工前", required: true, shortName: "01_施工前" },
            { id: 2, name: "(2) 路面切割", required: true, shortName: "02_路面切割" },
            { id: 3, name: "(3) 管溝開挖", required: true, shortName: "03_管溝開挖" },
            { id: 4, name: "(4) 擋土支撐", required: true, shortName: "04_擋土支撐" },
            { id: 5, name: "(5) 管線埋設", required: true, shortName: "05_管線埋設" },
            { id: 6, name: "(6) 設施埋設、設施型式、補充說明欄", required: true, hasExtraInput: true, placeholder: "請輸入設施型式與補充說明...", shortName: "06_設施埋設" },
            { id: 7, name: "(7) 管底砂", required: true, shortName: "07_管底砂" },
            { id: 8, name: "(8) 管頂砂/警示帶", required: true, shortName: "08_管頂砂警示帶" },
            { id: 9, name: "(9) CLSM澆置", required: true, shortName: "09_CLSM澆置" },
            { id: 10, name: "(10) AC厚度量測", required: true, shortName: "10_AC厚度量測" },
            { id: 11, name: "(11) AC舖設作業", required: true, shortName: "11_AC舖設作業" },
            { id: 12, name: "(12) 路面復舊(含標線)", required: true, isEndDateTrigger: true, shortName: "12_路面復舊" },
            { id: 13, name: "(13) 前巷預留、設施型式", required: false, hasExtraInput: true, placeholder: "請輸入前巷預留規格/設施說明...", shortName: "13_前巷預留" }
        ];

        let projects = {};
        let currentProjectId = null;
        let currentTab = 'active';

        window.onload = function() {
            loadProjectsFromStorage();
            refreshUI();
        };

        function loadProjectsFromStorage() {
            const saved = localStorage.getItem('road_work_projects_25H2');
            if (saved) {
                try { projects = JSON.parse(saved); } catch(e) { projects = {}; }
            }
            if (Object.keys(projects).length === 0) {
                const defaultId = "prj_" + Date.now();
                projects[defaultId] = {
                    id: defaultId,
                    waterSystemId: "2-5H-2",
                    teamName: "第一施工班",
                    startDate: new Date().toISOString().split('T')[0],
                    endDate: "",
                    isCompleted: false,
                    photos: {}
                };
                currentProjectId = defaultId;
                saveProjectsToStorage();
            } else {
                const firstActive = Object.values(projects).find(p => !p.isCompleted);
                currentProjectId = firstActive ? firstActive.id : Object.keys(projects)[0];
            }
        }

        function saveProjectsToStorage() {
            localStorage.setItem('road_work_projects_25H2', JSON.stringify(projects));
        }

        function getCurrentProject() { return projects[currentProjectId]; }

        function switchTab(tab) {
            currentTab = tab;
            const activeBtn = document.getElementById('tabActiveBtn');
            const completedBtn = document.getElementById('tabCompletedBtn');

            if (tab === 'active') {
                activeBtn.className = "flex-1 py-3 text-center font-black text-lg rounded-xl transition flex items-center justify-center gap-2 bg-amber-400 text-slate-950 shadow-md";
                completedBtn.className = "flex-1 py-3 text-center font-black text-lg rounded-xl transition flex items-center justify-center gap-2 bg-slate-800 text-slate-400 hover:text-white";
            } else {
                completedBtn.className = "flex-1 py-3 text-center font-black text-lg rounded-xl transition flex items-center justify-center gap-2 bg-emerald-500 text-slate-950 shadow-md";
                activeBtn.className = "flex-1 py-3 text-center font-black text-lg rounded-xl transition flex items-center justify-center gap-2 bg-slate-800 text-slate-400 hover:text-white";
            }

            renderProjectDropdown();
            const filteredList = Object.values(projects).filter(p => tab === 'completed' ? p.isCompleted : !p.isCompleted);
            currentProjectId = filteredList.length > 0 ? filteredList[0].id : null;
            refreshUI();
        }

        function renderProjectDropdown() {
            const select = document.getElementById('projectSelect');
            select.innerHTML = "";
            const allList = Object.values(projects);
            const activeList = allList.filter(p => !p.isCompleted);
            const completedList = allList.filter(p => p.isCompleted);

            document.getElementById('activeCount').innerText = activeList.length;
            document.getElementById('completedCount').innerText = completedList.length;

            const currentList = currentTab === 'completed' ? completedList : activeList;
            if (currentList.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.innerText = currentTab === 'completed' ? "（目前無已完成專案）" : "（無進行中專案）";
                select.appendChild(opt);
                return;
            }

            currentList.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.selected = (p.id === currentProjectId);
                opt.innerText = `水系：${p.waterSystemId || '未命名'} (${p.teamName || '未填工班'})`;
                select.appendChild(opt);
            });
        }

        function selectProject(id) {
            if (!id) return;
            currentProjectId = id;
            refreshUI();
        }

        function createNewProjectPrompt() {
            const waterId = prompt("請輸入新的【水系編號】：", "2-5H-");
            if (!waterId || waterId.trim() === "") return;
            const newId = "prj_" + Date.now();
            projects[newId] = {
                id: newId,
                waterSystemId: waterId.trim(),
                teamName: "",
                startDate: new Date().toISOString().split('T')[0],
                endDate: "",
                isCompleted: false,
                photos: {}
            };
            currentProjectId = newId;
            currentTab = 'active';
            saveProjectsToStorage();
            switchTab('active');
            showToast(`已建立水系編號：${waterId}`);
        }

        function refreshUI() {
            renderProjectDropdown();
            const proj = getCurrentProject();
            const statusBadge = document.getElementById('currentStatusBadge');
            const archiveBtnText = document.getElementById('archiveBtnText');

            if (!proj) {
                document.getElementById('waterSystemId').value = "";
                document.getElementById('teamName').value = "";
                document.getElementById('startDate').value = "";
                document.getElementById('endDate').value = "";
                document.getElementById('workDaysDisplay').innerText = "0";
                document.getElementById('photoItemsContainer').innerHTML = `<div class="text-center py-8 text-slate-500 font-bold">請點擊上方「+ 新增水系編號」開始建立工程專案</div>`;
                updateProgress();
                return;
            }

            document.getElementById('waterSystemId').value = proj.waterSystemId || "";
            document.getElementById('teamName').value = proj.teamName || "";
            document.getElementById('startDate').value = proj.startDate || "";
            document.getElementById('endDate').value = proj.endDate || "";

            if (proj.isCompleted) {
                statusBadge.className = "font-bold px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
                statusBadge.innerHTML = `<i class="fa-solid fa-check-double"></i> 狀態：已歸檔完成`;
                archiveBtnText.innerText = "重新解檔至「進行中」";
            } else {
                statusBadge.className = "font-bold px-2.5 py-1 rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/40";
                statusBadge.innerHTML = `<i class="fa-solid fa-person-digging"></i> 狀態：進行中施工`;
                archiveBtnText.innerText = "手動歸檔至「已完成」";
            }

            calculateDays();
            renderPhotoItems();
            updateProgress();
        }

        function updateCurrentProjectInfo() {
            const proj = getCurrentProject();
            if (!proj) return;
            proj.waterSystemId = document.getElementById('waterSystemId').value;
            proj.teamName = document.getElementById('teamName').value;
            proj.startDate = document.getElementById('startDate').value;
            saveProjectsToStorage();
            renderProjectDropdown();
            calculateDays();
        }

        function manualToggleArchive() {
            const proj = getCurrentProject();
            if (!proj) return;
            proj.isCompleted = !proj.isCompleted;
            saveProjectsToStorage();
            if (proj.isCompleted) {
                showToast(`專案已移至已完成歸檔！`);
                switchTab('completed');
            } else {
                showToast(`專案已回復為進行中！`);
                switchTab('active');
            }
        }

        function deleteCurrentProject() {
            const proj = getCurrentProject();
            if (!proj) return;
            if (confirm(`確定要刪除水系編號「${proj.waterSystemId}」的整份專案與所有照片嗎？`)) {
                delete projects[proj.id];
                saveProjectsToStorage();
                showToast("專案已刪除");
                loadProjectsFromStorage();
                refreshUI();
            }
        }

        function renderPhotoItems() {
            const proj = getCurrentProject();
            const container = document.getElementById('photoItemsContainer');
            container.innerHTML = "";
            if (!proj) return;

            PHOTO_ITEMS.forEach(item => {
                const photoData = proj.photos[item.id];
                const isUploaded = !!photoData && !!photoData.url;
                const itemCard = document.createElement('div');
                itemCard.className = `bg-slate-900 rounded-xl p-4 border-2 ${isUploaded ? 'border-emerald-500/80 bg-emerald-950/10' : (item.required ? 'border-red-500/60' : 'border-slate-700')} transition-all`;

                itemCard.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                        <div class="flex items-center gap-3">
                            <div class="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full ${isUploaded ? 'bg-emerald-500 text-slate-950' : (item.required ? 'bg-red-500/20 text-red-400 border border-red-500' : 'bg-slate-700 text-slate-400')}">
                                <i class="fa-solid ${isUploaded ? 'fa-check text-lg font-black' : (item.required ? 'fa-lightbulb text-sm animate-pulse' : 'fa-circle-info')}"></i>
                            </div>
                            <div>
                                <h3 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                                    ${item.name}
                                    ${item.required ? '<span class="text-xs bg-red-500/20 text-red-400 px-2 py-0.5 rounded border border-red-500/30">必拍</span>' : '<span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded">選填</span>'}
                                </h3>
                                <p class="text-xs ${isUploaded ? 'text-emerald-400' : 'text-slate-400'}">
                                    ${isUploaded ? `拍攝日期：${photoData.timestamp}` : (item.required ? '⚠️ 尚未拍照上傳' : '可選填補充')}
                                </p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <label class="cursor-pointer bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-950 font-black px-4 py-3 rounded-xl flex items-center gap-2 text-base shadow-md w-full sm:w-auto justify-center transition">
                                <i class="fa-solid fa-camera text-lg"></i>
                                <span>${isUploaded ? '重新拍照' : '現場拍照'}</span>
                                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event, ${item.id}, ${item.isEndDateTrigger})">
                            </label>
                        </div>
                    </div>
                    ${item.hasExtraInput ? `
                        <div class="mt-2">
                            <input type="text" id="note_input_${item.id}" placeholder="${item.placeholder}" value="${photoData && photoData.note ? photoData.note : ''}" onchange="updatePhotoNote(${item.id})" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 outline-none focus:border-amber-400">
                        </div>
                    ` : ''}
                    ${isUploaded ? `
                        <div class="mt-3 relative rounded-xl overflow-hidden border-2 border-emerald-500/50 group bg-black">
                            <img src="${photoData.url}" class="w-full max-h-72 object-contain bg-black">
                            <div class="absolute bottom-2 right-2 bg-black/80 text-amber-300 font-mono text-xs px-2.5 py-1 rounded-md border border-amber-400/40 backdrop-blur-xs flex items-center gap-1.5">
                                <i class="fa-regular fa-calendar"></i>
                                <span>${photoData.timestamp}</span>
                            </div>
                            <button onclick="removePhoto(${item.id})" class="absolute top-2 right-2 bg-red-600/90 text-white p-2 rounded-lg text-sm hover:bg-red-500 active:scale-90 transition">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(itemCard);
            });
        }

        // 核心修改：只留下簡單的西元年-月-日浮水印，絕不重疊
        function handleImageUpload(event, itemId, isEndDateTrigger) {
            const proj = getCurrentProject();
            if (!proj) return;
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    ctx.drawImage(img, 0, 0);

                    const now = new Date();
                    const yyyy = now.getFullYear();
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    const dd = String(now.getDate()).padStart(2, '0');
                    const dateStr = `${yyyy}-${mm}-${dd}`; // 簡潔西元年月日

                    const fontSize = Math.max(24, Math.floor(canvas.width / 25));
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    const textWidth = ctx.measureText(dateStr).width;
                    
                    // 繪製半透明背景框與單一簡潔日期文字
                    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                    ctx.fillRect(canvas.width - textWidth - 50, canvas.height - fontSize * 2.2, textWidth + 35, fontSize * 1.6);
                    
                    ctx.fillStyle = "#facc15";
                    ctx.fillText(dateStr, canvas.width - textWidth - 32, canvas.height - fontSize * 1.0);

                    const stampedUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const existingNote = document.getElementById(`note_input_${itemId}`) ? document.getElementById(`note_input_${itemId}`).value : '';

                    proj.photos[itemId] = {
                        url: stampedUrl,
                        timestamp: dateStr,
                        note: existingNote
                    };

                    if (isEndDateTrigger) {
                        proj.endDate = dateStr;
                        document.getElementById('endDate').value = dateStr;
                        calculateDays();
                        setTimeout(() => {
                            if (confirm(`🎉 已完成第 (12) 項路面復舊照片！\n開挖結束日已自動設為 ${dateStr}。\n\n是否直接將此專案歸檔至【已完成】？`)) {
                                proj.isCompleted = true;
                                saveProjectsToStorage();
                                switchTab('completed');
                                return;
                            }
                        }, 300);
                    }

                    saveProjectsToStorage();
                    refreshUI();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updatePhotoNote(itemId) {
            const proj = getCurrentProject();
            const input = document.getElementById(`note_input_${itemId}`);
            if (proj && input && proj.photos[itemId]) {
                proj.photos[itemId].note = input.value;
                saveProjectsToStorage();
            }
        }

        function removePhoto(itemId) {
            const proj = getCurrentProject();
            if (proj && confirm("確定要刪除這張相片嗎？")) {
                delete proj.photos[itemId];
                saveProjectsToStorage();
                refreshUI();
            }
        }

        function updateProgress() {
            const proj = getCurrentProject();
            const requiredItems = PHOTO_ITEMS.filter(item => item.required);
            let completedCount = 0;
            if (proj) {
                requiredItems.forEach(item => {
                    if (proj.photos[item.id] && proj.photos[item.id].url) completedCount++;
                });
            }
            const percent = Math.round((completedCount / requiredItems.length) * 100);
            document.getElementById('progressPercent').innerText = `完成度 ${percent}%`;
            document.getElementById('progressCount').innerText = `${completedCount} / ${requiredItems.length} 項`;
            const bar = document.getElementById('progressBar');
            bar.style.width = `${percent}%`;
            bar.innerText = percent > 15 ? `${percent}%` : '';
        }

        function calculateDays() {
            const proj = getCurrentProject();
            if (!proj || !proj.startDate || !proj.endDate) {
                document.getElementById('workDaysDisplay').innerText = "0";
                return;
            }
            const start = new Date(proj.startDate);
            const end = new Date(proj.endDate);
            if (start > end) {
                document.getElementById('workDaysDisplay').innerText = "0";
                return;
            }
            let count = 0, cur = new Date(start);
            while (cur <= end) {
                if (cur.getDay() !== 0) count++;
                cur.setDate(cur.getDate() + 1);
            }
            document.getElementById('workDaysDisplay').innerText = count;
        }

        // 一鍵下載此專案所有已上傳照片功能
        function downloadAllProjectPhotos() {
            const proj = getCurrentProject();
            if (!proj || Object.keys(proj.photos).length === 0) {
                showToast("目前尚無任何照片可下載！");
                return;
            }

            let count = 0;
            PHOTO_ITEMS.forEach(item => {
                const photo = proj.photos[item.id];
                if (photo && photo.url) {
                    count++;
                    setTimeout(() => {
                        const a = document.createElement('a');
                        a.href = photo.url;
                        a.download = `水系_${proj.waterSystemId}_${item.shortName}.jpg`;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    }, count * 300); // 依序下載避免瀏覽器阻擋
                }
            });
            showToast(`正在下載 ${count} 張照片，請稍候...`);
        }

        function copyLineMessage() {
            const proj = getCurrentProject();
            if (!proj) { showToast("請先選擇或新增水系編號"); return; }

            const waterId = proj.waterSystemId || "（未填寫）";
            const team = proj.teamName || "（未填寫）";
            const startDate = proj.startDate || "未設定";
            const endDate = proj.endDate || "未設定";
            const workDays = document.getElementById('workDaysDisplay').innerText;

            const requiredItems = PHOTO_ITEMS.filter(item => item.required);
            const missingItems = [];
            let completedCount = 0;

            requiredItems.forEach(item => {
                if (proj.photos[item.id] && proj.photos[item.id].url) completedCount++;
                else missingItems.push(item.name);
            });

            const percent = Math.round((completedCount / requiredItems.length) * 100);

            let msg = `🚨【(2-5H-2)-道路施工 照片缺漏提醒】🚨\n`;
            msg += `---------------------------------\n`;
            msg += `🔹 水系編號：${waterId}\n`;
            msg += `🔹 工班名稱：${team}\n`;
            msg += `📅 施工區間：${startDate} ～ ${endDate}\n`;
            msg += `⏱️ 實際施工天數：${workDays} 天 (已扣除週日)\n`;
            msg += `---------------------------------\n`;
            msg += `📊 完成度：${completedCount}/${requiredItems.length} 項 (${percent}%)\n\n`;

            if (missingItems.length === 0) {
                msg += `🎉 1~12項必拍照項【已全部上傳完成】！`;
            } else {
                msg += `⚠️ 【尚未上傳項目 (${missingItems.length}張)】：\n`;
                missingItems.forEach((name, idx) => { msg += `  ${idx + 1}. ${name}\n`; });
                msg += `\n請儘速依規範補拍上傳！`;
            }

            navigator.clipboard.writeText(msg).then(() => {
                showToast("已複製 LINE 提醒訊息！");
            });
        }

        function exportDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `道路施工專案全部備份_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast("已下載全部專案備份檔！");
        }

        function toggleHighContrast() {
            document.body.classList.toggle('high-contrast');
            showToast("已切換視覺對比模式");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }
    </script>
</body>
